<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deal Tracker</title>
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/fomantic-ui/2.8.5/semantic.min.css" integrity="sha384-Rthvz0mXDIQ4eBY+YSzTFStC6+fUtFbE0VlG27O/0VY/ah7XYaZ0IHwyx4hsTEDp" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

  <div class="ui inverted vertical segment main">
    <div class="ui middle aligned center aligned grid loginForm">
      <div class="column">

        <!-- Logo and tagline -->
        <h1 class="homepageLogo">Deal Tracker</h1>
        <h5 class="tagline">A simple yet powerful interface for tracking deals through the sales process.</h5>

        <!-- Sign in area -->
        <form id="signInForm" class="ui large form signInForm">
          <div class="ui stacked segment">
            <div class="field">
              <div class="ui left icon input">
                <i class="user icon"></i>
                <input type="email" name="email" placeholder="Email" id="email" autocomplete="email" required>
              </div>
            </div>
            <div class="field">
              <div class="ui left icon input">
                <i class="lock icon"></i>
                <input type="password" name="password" placeholder="Password" id="password" autocomplete="current-password" required>
              </div>
            </div>
            <div id="signInError" class="ui negative message" style="display:none"></div>
            <div id="signIn" class="ui fluid large blue submit button">Sign In</div>
          </div>
        </form>
        <div class="ui message">
          New user? <a id="signUpPage" href="#">Sign Up</a>
        </div>
      </div>
    </div>
    
    <!-- Sign up modal: -->
    <div class="ui modal">
      <div class="ui middle aligned center aligned grid">
        <div class="column signUpForm">
          <h3 class="signUpTitle">Create an Account:</h3>
          
          <!-- Sign up form: -->
          <form id="signUpForm" class="ui large form">
            <div class="ui stacked segment">
              <div class="field">
                <div class="ui left icon input">
                  <i class="user icon"></i>
                  <input type="text" name="newName" placeholder="Name" id="newName" autocomplete="name" maxlength="100" required>
                </div>
              </div>
              <div class="field">
                <div class="ui left icon input">
                  <i class="mail icon"></i>
                  <input type="email" name="newEmail" placeholder="Email" id="newEmail" autocomplete="email" required>
                </div>
              </div>
              <div class="field">
                <div class="ui left icon input">
                  <i class="lock icon"></i>
                  <input type="password" name="newPassword" placeholder="Password (8+ characters)" id="newPassword" autocomplete="new-password" minlength="8" maxlength="72" required>
                </div>
              </div>
              <div id="signUpError" class="ui negative message" style="display:none"></div>
              <div id="signUp" class="ui fluid large blue submit button">Sign Up</div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Script -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fomantic-ui/2.8.5/semantic.min.js" integrity="sha384-t21T6C5S3M6eb3zUaxVTfCRQMM7LSnyg5mPrXxw4HYWYiHlChOMjXqmBYcWyAkzM" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/axios@1.20.0/dist/axios.min.js" integrity="sha384-mIJWc6qj9ALoBF2yHkNOf0fbGel66+X3UkhYw57p36/PaTyDpO9pvnxrVZ7ZGJfi" crossorigin="anonymous"></script>
  <script src="./index.js"></script>

</body>
</html>
